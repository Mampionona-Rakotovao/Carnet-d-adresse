name: carnet_adresses_repere
description: Carnet d'adresses basé sur les points de repère (mémoire L3)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend / base de données
  supabase_flutter: ^2.5.6

  # Ouverture des liens reçus par email (réinitialisation mot de passe)
  app_links: ^7.2.1

  # Géolocalisation
  geolocator: ^14.0.2
  permission_handler: ^11.3.1

  # Carte (OpenStreetMap)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Photos
  image_picker: ^1.1.2

  # Navigation / état
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1

  # Partage (bouton "Partager" via le système Android)
  share_plus: ^10.0.2

  # UI utilitaires
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0

  # Son de notification à l'ouverture d'un lien partagé
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/ic_launcher.png"
  adaptive_icon_background: "#FDFDFE"
  adaptive_icon_foreground: "assets/icons/ic_launcher_fg.png"
  min_sdk_android: 21
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/